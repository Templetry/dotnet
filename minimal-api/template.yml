schema_version: 1
name: dotnet-minimal-api
description: .NET minimal API — C#, top-level program, xUnit with WebApplicationFactory
kinds: [backend]
languages: [csharp]
frameworks: [aspnetcore]

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"

identity:
  - from: "TemplateApp"            # assembly, root namespace, csproj names, dirs
    to: "{project_name.pascal}"
  - from: "template-app"           # solution name, docker tag
    to: "{project_name.kebab}"

features:
  - key: environments
    label: development / staging / production profiles (ADR-0018)
    default: true
    files:
      - "src/TemplateApp/AppOptions.cs"
      - "src/TemplateApp/appsettings.Development.json"
      - "src/TemplateApp/appsettings.Staging.json"
      - "src/TemplateApp/appsettings.Production.json"
      - "tests/TemplateApp.Tests/EnvironmentProfileTests.cs"

  - key: docker
    label: Dockerfile (aspnet runtime)
    default: true
    files: ["Dockerfile", ".dockerignore"]

presets:
  - key: minimal
    label: Single configuration, no Docker
    features: {environments: false, docker: false}

verify:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  run: dotnet test
