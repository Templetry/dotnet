name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimal-api:
    name: minimal-api (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./minimal-api --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"
      - name: Build and test rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          dotnet build
          dotnet test

  razor-web:
    name: razor-web (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both ends of the feature axis: everything on, and nothing on.
          - name: default
            args: ""
          - name: minimal
            args: "--preset minimal"
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./razor-web --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" ${{ matrix.args }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"
      - name: Build and test rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          dotnet build
          dotnet test
